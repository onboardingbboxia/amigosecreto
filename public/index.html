<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<title>Amigo Secreto</title>

<style>html,body{margin:0}body{min-height:100vh}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: app shell — sticky header with countdown, tab bar, single content column (max 1040px) with cards placed by role. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E8ECEF; --ink:#13202B; --muted:#5A6774; --line:#D9E0E6;
  --accent:#C1233B; --accent-soft:#F8E3E6; --on-accent:#FFFFFF;
  --pine:#1D6A4E; --pine-soft:#DDEFE7; --gold:#9C7020; --gold-soft:#F5EAD3;
  --tag:#FBF6EC; --tag-ink:#3A2C18; --string:#B0894A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151E; --surface:#152130; --sunk:#0F1A26; --ink:#E7EDF2; --muted:#93A3B3; --line:#253445;
  --accent:#F05A6E; --accent-soft:#3A1E27; --on-accent:#1A0A0E;
  --pine:#55BC90; --pine-soft:#173329; --gold:#E3B75C; --gold-soft:#342A17;
  --tag:#2A2418; --tag-ink:#F1E6CF; --string:#8C7040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151E; --surface:#152130; --sunk:#0F1A26; --ink:#E7EDF2; --muted:#93A3B3; --line:#253445;
  --accent:#F05A6E; --accent-soft:#3A1E27; --on-accent:#1A0A0E;
  --pine:#55BC90; --pine-soft:#173329; --gold:#E3B75C; --gold-soft:#342A17;
  --tag:#2A2418; --tag-ink:#F1E6CF; --string:#8C7040; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand h1{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bow{width:30px;height:30px;flex:none}
.count{display:flex;align-items:baseline;gap:6px;background:var(--accent-soft);color:var(--accent);padding:4px 12px;border-radius:999px;font-weight:600;font-size:.85rem}
.count b{font-family:var(--f-display);font-size:1.15rem;font-weight:800}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

main{padding-block:20px 48px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}
@media (max-width:820px){.c7,.c5,.c6,.c4,.c8{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.pine{background:var(--pine);border-color:var(--pine);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=url],input[type=number],input[type=password],input[type=datetime-local],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{resize:vertical;min-height:80px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 150px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.pine{background:var(--pine-soft);color:var(--pine)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.red{background:var(--accent-soft);color:var(--accent)}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:.78rem;font-weight:700;color:#fff;flex:none;font-family:var(--f-display)}
.av.lg{width:42px;height:42px;font-size:1rem}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:8px;background:var(--sunk);padding:4px 12px 4px 4px;border-radius:999px;font-weight:500;font-size:.9rem;min-width:0}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.fact{background:var(--sunk);border-radius:10px;padding:12px;min-width:0}
.fact .v{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin-top:2px;overflow-wrap:anywhere}

/* Gift tag */
.tag-wrap{display:flex;justify-content:center;padding:18px 0 6px}
.gtag{position:relative;background:var(--tag);color:var(--tag-ink);width:min(320px,100%);padding:30px 26px 24px 46px;border-radius:6px 14px 14px 6px;transform:rotate(-2deg);box-shadow:0 10px 24px -14px rgba(0,0,0,.45);border:1px solid color-mix(in srgb,var(--string) 45%,transparent);clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%)}
.gtag::before{content:"";position:absolute;left:18px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--string)}
.gtag .line{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed color-mix(in srgb,var(--tag-ink) 35%,transparent);padding:6px 0}
.gtag .line span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.7;width:44px;flex:none}
.gtag .line b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;overflow-wrap:anywhere;min-width:0}
.blur{filter:blur(9px);user-select:none}
.reveal-btn{margin-top:14px}

/* Wishlist */
.wish{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.wish .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--gold-soft);color:var(--gold)}
.wish .ic svg{width:18px;height:18px}
.wish .body{flex:1;min-width:0}
.wish .t{font-weight:600;overflow-wrap:anywhere}
.wish a{overflow-wrap:anywhere;font-size:.88rem}
.wish .n{color:var(--muted);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:.92rem}

/* Messages */
.msg-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.msg-layout{grid-template-columns:minmax(0,1fr)}}
.threads{display:flex;flex-direction:column;gap:2px;padding:8px}
@media (max-width:760px){.threads{flex-direction:row;overflow-x:auto}}
.thread{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;min-width:0;flex:none}
.thread:hover{background:var(--sunk)}
.thread[aria-current="true"]{background:var(--accent-soft)}
.thread .nm{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .sub{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sep{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px}
@media (max-width:760px){.sep{display:none}}
.pane{padding:0;gap:0;overflow:hidden}
.pane-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgs{height:min(56vh,520px);overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.bubble{max-width:78%;display:flex;flex-direction:column;gap:2px}
.bubble .who{font-size:.75rem;font-weight:600;color:var(--muted)}
.bubble .tx{background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:14px 14px 14px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;align-items:flex-end}
.bubble.mine .tx{background:var(--accent);border-color:var(--accent);color:var(--on-accent);border-radius:14px 14px 4px 14px}
.bubble .tm{font-size:.7rem;color:var(--muted)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1}

/* Games */
.daily-emoji{font-size:2.6rem;letter-spacing:.12em;text-align:center;padding:10px 0;line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--pine-soft);border-color:var(--pine);color:var(--pine);font-weight:700}
.opt.bad{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt:disabled{cursor:default}
.rounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.rounds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.round{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;cursor:pointer}
.round:hover:not(:disabled){border-color:var(--accent)}
.round:disabled{cursor:default;background:var(--sunk)}
.round .rn{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.timer{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}

.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(560px,100%);max-height:100%;overflow:auto}

/* Ranking */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem}
.pod .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p1 .blk{height:120px;background:var(--gold-soft);color:var(--gold)}
.p2 .blk{height:88px;background:var(--sunk);color:var(--muted)}
.p3 .blk{height:64px;background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;width:36px}
td.tot{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
tr.me td{background:var(--accent-soft)}

/* Admin */
.list-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-row:last-child{border-bottom:0}
.chk{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;cursor:pointer;background:var(--surface)}
.chk[aria-pressed="true"]{background:var(--pine-soft);border-color:var(--pine);color:var(--pine);font-weight:600}

.center-screen{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.join{width:min(440px,100%);text-align:left}
.join h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.notice{background:var(--gold-soft);color:var(--gold);padding:10px 14px;border-radius:10px;font-size:.9rem;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
select{appearance:auto}

/* Login: panel con la etiqueta de regalo + formulario compacto */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:56px;align-items:center;width:min(900px,100%)}
.lhero{display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.lhero h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.lhero .gtag{margin:4px 0 14px 10px}
.lhero-sub{color:var(--muted);margin:0}
.dots{display:flex;flex-wrap:wrap;gap:6px;max-width:260px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--pine);border-color:var(--pine)}
.lform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lf-title{font-size:1.25rem}
.lf-fields{display:flex;flex-direction:column;gap:12px}
.lform .field{gap:5px;flex:none}
.lbl{font-size:.88rem;font-weight:600}
.lf-hint{font-size:.88rem;color:var(--muted);margin:0}
.lf-hint:empty,.lf-err:empty{display:none}
.lform input:not([type=checkbox]),.lform select{height:44px;padding:0 12px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pw{position:relative}
.pw input{padding-right:88px!important}
.pw-toggle{position:absolute;right:4px;top:4px;bottom:4px;border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;padding:0 10px;border-radius:8px;cursor:pointer}
.pw-toggle:hover{color:var(--ink);background:var(--line)}
.lform input:focus-visible,.lform select:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.lf-check{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.lf-check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.lf-err{color:var(--accent);font-size:.9rem;font-weight:600;margin:0}
.lf-submit{width:100%;height:46px;font-size:1rem}
.lf-foot{font-size:.82rem;color:var(--muted);margin:0}
@media (max-width:760px){
  .login{grid-template-columns:minmax(0,1fr);gap:18px}
  .lhero{align-items:flex-start}
  .lhero h1{font-size:1.9rem}
  .lhero .gtag,.dots{display:none}
  .lform{padding:18px}
}
</style>
</head>

<div id="app"></div>
<script>
/* ---------- Helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className = v;
    else if (k==="text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="value") el.value = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null||c===false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const svg = (p) => { const t=document.createElement("template"); t.innerHTML = p; return t.content.firstChild; };
const ICON = {
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12l-4 4H4z"/><path d="M16 20v-4h4"/><path d="M8 9h8M8 13h5"/></svg>',
  bow:'<svg class="bow" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="13" width="24" height="16" rx="2" fill="var(--accent)"/><rect x="2" y="9" width="28" height="6" rx="1.5" fill="var(--accent)"/><rect x="14" y="9" width="4" height="20" fill="var(--gold)"/><path d="M16 9c-3-6-10-6-9-1 1 3 6 2 9 1zM16 9c3-6 10-6 9-1-1 3-6 2-9 1z" fill="none" stroke="var(--gold)" stroke-width="2.2"/></svg>'
};
const num = v => (typeof v==="number" && isFinite(v)) ? v : 0;
const safeUrl = u => (typeof u==="string" && /^https?:\/\/\S+$/i.test(u.trim())) ? u.trim() : null;

const dayKeyLocal = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

async function api(method, url, body){
  let r;
  try{
    r = await fetch(url, { method, credentials:"same-origin", headers: body!==undefined ? {"Content-Type":"application/json","X-Amigo":"1"} : {"X-Amigo":"1"}, body: body!==undefined ? JSON.stringify(body) : undefined });
  }catch{ throw new Error("Sin conexión. Revisa tu internet e inténtalo de nuevo."); }
  let data = {}; try{ data = await r.json(); }catch{}
  if (!r.ok){
    if (r.status===401 && S.st && !url.startsWith("/api/login") && !url.startsWith("/api/password")){ sessionEnded(); }
    throw Object.assign(new Error(data.error || "Algo falló. Inténtalo de nuevo."), {status:r.status});
  }

}
